name: Phase 2 - wire EduVerse 3D into dashboards

# One-off helper for branch phase-2-3d-platform. Safe to remove after Phase 2.
# Mounts the existing Main Admin stage, verifies the views and scene loader,
# then commits only the dashboard integration to this branch.
on:
  push:
    branches: [phase-2-3d-platform]
    paths: ['.github/workflows/phase-2-wire-dashboards.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-2-wire-dashboards
  cancel-in-progress: false

env:
  APP_DIR: "Admin Panel Code/PHP CODE/PHP_CODE_V1.11.0"

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-3d-platform
          fetch-depth: 0

      - name: Mount the guarded Main Admin stage
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ["APP_DIR"])
          views = root / "resources" / "views"
          required = [
              views / "eduverse3d" / "main_admin.blade.php",
              views / "eduverse3d" / "stage.blade.php",
              root / "public" / "assets" / "eduverse3d" / "eduverse3d.js",
              root / "public" / "assets" / "eduverse3d" / "eduverse3d.css",
              root / "public" / "assets" / "eduverse3d" / "vendor" / "three.module.min.js",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              sys.exit("Required EduVerse 3D files are missing: " + ", ".join(missing))

          dashboard = views / "super_admin_dashboard.blade.php"
          data = dashboard.read_bytes()
          anchor = b"        {{-- Super Admin Dashboard --}}"
          block = (
              b"        @if (Auth::check() && Auth::user()->hasRole('Super Admin') && Auth::user()->can('schools-list'))\n"
              b"            @include('eduverse3d.main_admin')\n"
              b"        @endif\n\n"
          )
          if block in data:
              print("Guarded Main Admin stage is already mounted.")
          elif b"@include('eduverse3d.main_admin')" in data:
              sys.exit("An unguarded Main Admin stage include already exists; refusing to duplicate it.")
          else:
              count = data.count(anchor)
              if count != 1:
                  sys.exit(f"Dashboard anchor found {count} times; expected exactly one.")
              dashboard.write_bytes(data.replace(anchor, block + anchor, 1))
              print("Mounted the existing stage for Super Admins with schools-list permission.")
          PY

      - name: Verify Blade and 3D loading
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          test -s public/assets/eduverse3d/eduverse3d.js
          test -s public/assets/eduverse3d/eduverse3d.css
          test -s public/assets/eduverse3d/vendor/three.module.min.js
          node --check public/assets/eduverse3d/eduverse3d.js
          git diff --check

          work="$RUNNER_TEMP/ev3d-blade-check"
          mkdir -p "$work"
          cd "$work"
          composer init --no-interaction --name=ev3d/blade-check >/dev/null
          composer require --no-interaction --no-progress illuminate/view:^10.0 illuminate/filesystem:^10.0 ramsey/uuid:^4.7 >/dev/null
          cat > check.php <<'PHP'
          <?php
          require __DIR__ . '/vendor/autoload.php';
          use Illuminate\Filesystem\Filesystem;
          use Illuminate\View\Compilers\BladeCompiler;

          $root = rtrim($argv[1], '/');
          $targets = array_slice($argv, 2);
          $compiler = new BladeCompiler(new Filesystem(), sys_get_temp_dir());
          foreach ($targets as $relative) {
              $sourcePath = $root . '/' . $relative;
              $source = file_get_contents($sourcePath);
              if ($source === false) {
                  fwrite(STDERR, "Could not read: {$relative}\n");
                  exit(1);
              }
              $compiled = $compiler->compileString($source);
              $temporary = tempnam(sys_get_temp_dir(), 'ev3d-blade-');
              if ($temporary === false) {
                  fwrite(STDERR, "Could not create a temporary Blade output file.\n");
                  exit(1);
              }
              file_put_contents($temporary, $compiled);
              exec(escapeshellarg(PHP_BINARY) . ' -l ' . escapeshellarg($temporary), $output, $status);
              unlink($temporary);
              if ($status !== 0) {
                  fwrite(STDERR, "Blade/PHP syntax failed: {$relative}\n" . implode("\n", $output) . "\n");
                  exit($status);
              }
              echo "Blade/PHP syntax OK: {$relative}\n";
          }
          PHP
          php check.php "$GITHUB_WORKSPACE/$APP_DIR/resources/views" \
            super_admin_dashboard.blade.php \
            eduverse3d/main_admin.blade.php \
            eduverse3d/stage.blade.php

      - name: Commit and push dashboard integration
        run: |
          set -euo pipefail
          if git diff --quiet -- "$APP_DIR/resources/views/super_admin_dashboard.blade.php"; then
            echo "No dashboard integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$APP_DIR/resources/views/super_admin_dashboard.blade.php"
          git commit -m "Connect guarded EduVerse 3D admin dashboard"
          git push origin phase-2-3d-platform
