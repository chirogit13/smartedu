name: phase-2 student web build check

on:
  push:
    branches: [phase-1a-log-removal-helper]
    paths: ['.github/workflows/phase-2-student-web-build-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Student Web Code/eSchool Sass student web v-1.11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-3d-platform
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Show target commit
        run: git log -1 --oneline
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint changed files
        run: npx eslint src/components/eduverse3d "src/app/(dashboard)/student/dashboard/page.tsx" || echo "::warning::eslint reported issues"
      - name: Next build
        env:
          NEXT_PUBLIC_STUDENT_API_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx next build
